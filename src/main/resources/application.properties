server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.forward-headers-strategy=framework
# Avoid recording signed upload fields in HTTP client debug logs.
logging.level.org.springframework.web.client=INFO
# Model fallback order (first available model wins)
GEMINI_MODELS=gemini-2.5-flash-lite,gemini-2.0-flash-lite,gemini-2.5-flash,gemini-2.0-flash
